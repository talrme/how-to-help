<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How to Help</title>
  <meta name="theme-color" content="#eef8f5">
  <meta name="apple-mobile-web-app-title" content="How to Help">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="command-center actual-site" data-stage="production" data-asset-root="assets">
  <main class="site-shell">
    <header class="simple-hero">
      <div class="simple-title">
        <p class="eyebrow">Avi is here</p>
        <h1>How to Help</h1>
        <p>We love you. Thank you.</p>
      </div>
      <img src="assets/family-1.jpg" alt="Miri and Avi">
    </header>

    <section class="sections" data-sections aria-label="Ways to help"></section>

    <footer class="bottom-tools">
      <button type="button" data-open-qr aria-label="Show QR code">
        <span aria-hidden="true">▦</span>
        <span>QR</span>
      </button>
      <button type="button" data-open-settings aria-label="Open settings">
        <span aria-hidden="true">⚙</span>
        <span>Settings</span>
      </button>
    </footer>
  </main>

  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header>
        <div>
          <p class="eyebrow">How to Help</p>
          <h2 id="settings-title">Settings</h2>
        </div>
        <button type="button" class="plain-x" data-close-settings aria-label="Close settings">×</button>
      </header>
      <section class="settings-section">
        <h3>Style</h3>
        <div class="style-grid" data-style-grid>
          <button type="button" data-style-option="cozy"><span></span>Cozy</button>
          <button type="button" data-style-option="bright"><span></span>Bright</button>
          <button type="button" data-style-option="night"><span></span>Night</button>
        </div>
      </section>
      <section class="settings-section">
        <h3>List</h3>
        <label class="toggle-row"><span>Show descriptions by default</span><input type="checkbox" data-setting="openDescriptions"></label>
        <label class="toggle-row"><span>Compact list</span><input type="checkbox" data-setting="compact"></label>
      </section>
      <details class="settings-section advanced-settings">
        <summary><span>Advanced</span><span aria-hidden="true">⌄</span></summary>
        <label>
          <span>Published Google Doc URL</span>
          <input type="url" data-doc-url placeholder="https://docs.google.com/document/d/e/2PACX-1vQbbd27IH_bLefhDq0uu_RTxQq0S-WqH5Wk_iawjYdqaXKTiIoB1UHlBS3CN3i1IugfZRaVio5yttKq/pub">
        </label>
        <small>Leave blank to use the built-in published Google Doc source.</small>
      </details>
      <div class="settings-actions">
        <button type="button" class="primary-action" data-save-settings>Save</button>
        <button type="button" data-reset-device>Reset this device</button>
      </div>
    </div>
  </section>

  <div class="modal-backdrop" data-qr-backdrop hidden></div>
  <section class="qr-modal" data-qr-modal hidden role="dialog" aria-modal="true" aria-labelledby="qr-title">
    <div class="qr-panel">
      <header>
        <div>
          <p class="eyebrow">Share</p>
          <h2 id="qr-title">How to Help</h2>
        </div>
        <button type="button" class="plain-x" data-close-qr aria-label="Close QR code">×</button>
      </header>
      <img src="assets/qr-live.png" alt="QR code for the How to Help website">
      <a href="https://talrme.github.io/how-to-help/">https://talrme.github.io/how-to-help/</a>
    </div>
  </section>

  <script src="shared/config.js"></script>
  <script src="shared/app.js"></script>
</body>
</html>
